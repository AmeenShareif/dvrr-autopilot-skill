name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall .

      - name: Smoke test launcher
        run: python run.py --symbol NVDA

      - name: Smoke test offline demo
        run: python demo.py

      - name: Smoke test contest demo
        run: python demo_with_real_data.py
